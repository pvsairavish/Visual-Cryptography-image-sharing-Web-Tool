{% extends "base.html" %}
{% block title %}Decryption Result{% endblock %}
{% block content %}
  <div class="text-center mb-4">
    <h1 class="display-6 text-success">🔓 Decryption Successful</h1>
    <p class="text-muted">The original image has been reconstructed.</p>
  </div>

  <div class="d-flex justify-content-center">
    <div class="card shadow text-center p-4" style="max-width: 500px;">
      <img src="{{ result }}" class="img-fluid rounded mb-3" alt="Decrypted Image">
      <a href="{{ result }}" download class="btn btn-primary w-100">⬇ Download Decrypted Image</a>
    </div>
  </div>

  <div class="text-center mt-4">
    <a href="{{ url_for('index') }}" class="btn btn-outline-primary">🏠 Home</a>
  </div>
{% endblock %}
